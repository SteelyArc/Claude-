(async function(){
"use strict";
/* ============================================================
   WHAT IF A FORK FELL INTO A BLACK HOLE? — 61 s vertical (1080x1920) three.js
   Facts used (all real):
   - A typical stainless-steel fork has a mass of about 50 g.
   - Schwarzschild radius ≈ 2.95 km per solar mass → ≈ 29.5 km for 10 Suns.
   - Tidal acceleration across a body of length L ≈ 2GML/r³: the near end is
     pulled harder. For 10 Suns a steel fork is torn apart roughly 100 km out
     (order-of-magnitude estimate) — "spaghettification".
   - Radial fall from rest at 1,000 km takes ≈ 30 ms (Newtonian estimate),
     so the HUD shows the slow-motion factor live.
   - A distant observer sees infalling matter slow down, redden and fade at
     the horizon; the falling object itself crosses without noticing.
   - Proper time from horizon to centre for a fall from far away ≈ (2/3)·Rs/c
     ≈ 0.07 ms for 10 Suns (general relativity; the centre is not understood).
   - Sagittarius A* ≈ 4.3 million Suns, horizon radius ≈ 13 million km; tidal
     forces at its horizon are tiny, so a fork would cross intact.
   - A black hole keeps only mass, spin and charge: it gets ≈ 50 g heavier.
   ============================================================ */

const W = 1080, H = 1920, DUR = 61;
const params = new URLSearchParams(location.search);
const fixedT = params.has('t') ? parseFloat(params.get('t')) : null;
if (params.has('clean') || fixedT !== null) document.getElementById('ui').classList.add('hidden');

// ---------- utils ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(20261122);
const R = (a,b)=>a+(b-a)*rnd();
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x);};
const easeOut=x=>1-Math.pow(1-clamp(x),3);
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(rnd()*a.length)];
const lin=h=>new THREE.Color(h).convertSRGBToLinear();
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:lin(c),roughness:0.82,metalness:0},o));
const wrapS=(x,s)=>((x+s/2)%s+s)%s-s/2;

try{ await Promise.race([Promise.all([document.fonts.load('900 100px Archivo'),document.fonts.load('800 60px Archivo'),document.fonts.load('700 40px Archivo')]),new Promise(r=>setTimeout(r,2500))]); }catch(e){}

// ---------- renderer & output ----------

// ---------- geometry helpers (same as the original) ----------
function rrShape(w,h,r){
  const s=new THREE.Shape(), x=-w/2, y=-h/2; r=Math.max(0.001,Math.min(r,w/2-0.001,h/2-0.001));
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s;
}
function rbox(w,h,d,r=0.1){
  const b=Math.min(r,w/2.2,h/2.2,d/2.2);
  const g=new THREE.ExtrudeGeometry(rrShape(w-2*b,h-2*b,b*0.8),{depth:Math.max(0.002,d-2*b),bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:3,curveSegments:4});
  g.translate(0,0,-Math.max(0.002,d-2*b)/2);
  return g;
}
function shadowed(o,cast=true,recv=true){o.traverse(m=>{if(m.isMesh){m.castShadow=cast;m.receiveShadow=recv;}});return o;}
function canvasTex(w,h,draw,repeat){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat[0],repeat[1]);}
  return t;
}
function roundRectPath(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function makeLabel(small,big,{accent='#FFD43B',worldH=1.0}={}){
  const c=document.createElement('canvas'), g=c.getContext('2d');
  const s1=44,s2=74,pad=30;
  function measure(sm,bg){g.font=`700 ${s1}px ${FONT}`;const w1=sm?g.measureText(sm).width:0;g.font=`900 ${s2}px ${FONT}`;return Math.max(w1,g.measureText(bg).width);}
  c.width=Math.ceil(measure(small,big)+pad*2+60); c.height=Math.ceil((small?s1*1.25:0)+s2*1.2+pad*1.6);
  function draw(sm,bg){
    g.clearRect(0,0,c.width,c.height);
    const w=Math.min(c.width-8,measure(sm,bg)+pad*2), x=(c.width-w)/2;
    roundRectPath(g,x,4,w,c.height-8,26); g.fillStyle='rgba(18,20,34,0.86)'; g.fill();
    g.textAlign='center'; g.textBaseline='top';
    let y=pad*0.8;
    if(sm){g.font=`700 ${s1}px ${FONT}`;g.fillStyle='#c9d0f2';g.fillText(sm,c.width/2,y);y+=s1*1.25;}
    g.font=`900 ${s2}px ${FONT}`;g.fillStyle=accent;g.fillText(bg,c.width/2,y);
  }
  draw(small,big);
  const tex=new THREE.CanvasTexture(c);tex.encoding=THREE.sRGBEncoding;tex.anisotropy=8;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false,fog:false,toneMapped:false}));
  sp.renderOrder=20; sp.scale.set(worldH*c.width/c.height,worldH,1);
  sp.userData.redraw=(a,b)=>{draw(a,b);tex.needsUpdate=true;};
  return sp;
}
const ringMat=(col)=>new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uR:{value:1},uS:{value:3},uO:{value:1},uW:{value:0.07},uC:{value:new THREE.Color(col)}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform float uR,uS,uO,uW;uniform vec3 uC;varying vec2 vUv;void main(){vec2 p=(vUv-0.5)*uS;float d=length(p)-uR;float a=1.0-smoothstep(uW*0.35,uW,abs(d));a+=0.4*exp(-abs(d)/(uW*3.0));gl_FragColor=vec4(uC,min(a,1.0)*uO);}'});

  const f=new THREE.Group(); const F={f,R,eyes:[],pupils:[],brows:[]};

    const p=new THREE.Mesh(new THREE.SphereGeometry(0.095*R,16,12),faceK); f.add(p); F.pupils.push(p);
    const b=new THREE.Mesh(rbox(0.28*R,0.06*R,0.06*R,0.025*R),faceK); b.position.set(s*0.3*R,0.52*R,1.0*R); f.add(b); F.brows.push(b);
    const c=new THREE.Mesh(new THREE.SphereGeometry(0.09*R,16,10),cheekM); c.scale.set(1.4,0.8,0.4); c.position.set(s*0.52*R,-0.04*R,1.0*R); f.add(c);
  }
  F.smile=new THREE.Mesh(new THREE.TorusGeometry(0.22*R,0.04*R,10,36,Math.PI),faceK); f.add(F.smile);
  F.o=new THREE.Mesh(new THREE.SphereGeometry(0.12*R,20,14),faceK); F.o.position.set(0,-0.22*R,1.05*R); f.add(F.o);
  parent.add(f); return F;
}
function setFace(F,{open=1,look=[0,0],brow=0,mouth='smile',ms=1,frown=false}){
  const R=F.R;
  F.eyes.forEach(e=>e.scale.set(1,1.15*Math.max(0.06,open),0.55));
  F.pupils.forEach((p,i)=>{const s=i?1:-1;p.position.set(s*0.3*R+look[0]*R,0.2*R+look[1]*R,1.12*R);p.scale.set(1,Math.max(0.05,Math.min(1,open*1.4)),0.5);p.visible=open>0.2;});
  F.brows.forEach((b,i)=>{const s=i?1:-1;b.position.y=(0.52+0.1*brow)*R;b.rotation.z=s*(-0.28*brow);});
  F.smile.visible=mouth==='smile'; F.smile.rotation.z=frown?0:Math.PI; F.smile.position.set(0,(frown?-0.34:-0.1)*R,1.06*R); F.smile.scale.setScalar(ms);
  F.o.visible=mouth==='o'; F.o.scale.set(ms,1.3*ms,0.35);
}
const blinkAt=(t,times)=>{for(const b of times){const d=Math.abs(t-b);if(d<0.09)return d/0.09;}return 1;};
// flat version of a face for the fork (features sit on a flat surface)
function flatFace(R,parent,zOff){const F=makeFace(R,parent);F.f.position.z=zOff-R;return F;}

   THE FORK (stainless steel, with a face)
   ============================================================ */
const steel=new THREE.MeshStandardMaterial({color:lin('#d9dee8'),roughness:0.28,metalness:0.45});
function rrS(w,h,r){return rrShape(w,h,r);}
function buildFork(){
  const g=new THREE.Group(); const D=0.07;
  const ex=(shape)=>new THREE.ExtrudeGeometry(shape,{depth:D,bevelEnabled:true,bevelThickness:0.025,bevelSize:0.025,bevelSegments:3,curveSegments:10});
  const handle=new THREE.Mesh(ex(rrS(0.26,1.25,0.12)),steel); handle.position.set(0,0.62,-D/2); g.add(handle);
  const neckS=new THREE.Shape(); neckS.moveTo(-0.11,0); neckS.lineTo(0.11,0); neckS.lineTo(0.07,0.3); neckS.lineTo(-0.07,0.3); neckS.closePath();
  const neck=new THREE.Mesh(ex(neckS),steel); neck.position.set(0,1.22,-D/2); g.add(neck);
  const headS=new THREE.Shape(); headS.moveTo(-0.08,0); headS.lineTo(0.08,0); headS.quadraticCurveTo(0.26,0.06,0.25,0.3); headS.lineTo(-0.25,0.3); headS.quadraticCurveTo(-0.26,0.06,-0.08,0);
  const head=new THREE.Mesh(ex(headS),steel); head.position.set(0,1.5,-D/2); g.add(head);
  const tines=[];
  for(let i=0;i<4;i++){const tn=new THREE.Mesh(rbox(0.075,0.62,D+0.04,0.035),steel);tn.position.set(-0.19+i*0.127,2.1,0);g.add(tn);tines.push(tn);}
  shadowed(g);
  const face=flatFace(0.13,g,0.075); face.f.position.y=0.95; face.f.scale.setScalar(1.0);
  g.userData={handle,neck,head,tines,face};
  return g;
}

    sF.tines.forEach(tn=>{tn.position.y=2.1;tn.rotation.z=0;}); sF.head.position.y=1.5;
    setFace(sF.face,{open:blinkAt(t,[46.3,49.2]),mouth:'smile',ms:1.1,brow:0.2});
    lblSgr.visible=true; lblSgr.position.set(3,big*0.55,bz+big+2); lblSgr.material.opacity=clamp((u-0.4)/0.4);
    lblIntact.visible=u>1.6&&u<7.3; lblIntact.position.copy(sFork.position).add(new THREE.Vector3(2.5,5.5,0)); lblIntact.material.opacity=clamp((u-1.6)/0.3);
    sCam.position.set(16,6,bz+big+62-0.8*u); camTarget.set(0,2,bz); sCam.fov=50;
  } else {
    // the black hole tries to burp… nothing comes out
    const u=t-52; bhFace.f.visible=true;
    bhFace.f.lookAt(sCam.position);
    const puff=clamp((u-2.0)/0.6)*(1-clamp((u-3.6)/0.3));
    setFace(bhFace,{open:u>3.4&&u<4.6?0.45:blinkAt(t,[53.2,57.5,59.4]),brow:puff>0?0.8:(u>4.2?-0.5:0),mouth:puff>0||(u>3.6&&u<4.6)?'o':'smile',ms:puff>0?0.45+0.1*puff:0.9,look:[0,0]});
    bhFace.f.children.forEach(m=>{if(m.material===cheekM)m.scale.set(1.4+puff*0.9,0.8+puff*0.7,0.4+puff*0.6);});
    lblDots.visible=u>3.8&&u<5.6; lblDots.position.set(RV*1.1,RV*1.35,RV*0.8);
    lblPlus.visible=u>5.2; lblPlus.position.set(0,-RV*1.9,RV*0.8); const kk=easeOut((u-5.2)/0.35)*(1+0.15*Math.sin(clamp((u-5.2)/0.5)*Math.PI)); lblPlus.material.opacity=clamp((u-5.2)/0.2);
    sCam.position.set(1.2*Math.sin(u*0.12),1.1+0.05*u,11.5-0.25*u); camTarget.set(0,0.3,0); sCam.fov=45;
  }
  // light: hot inner disk as the key light
  sKey.position.copy(camTarget).add(sc===3?new THREE.Vector3(5,6,1.5):new THREE.Vector3(-4,6,-2)); sKey.target.position.copy(camTarget);
  if(sc===7){sKey.position.copy(sFork.position).add(new THREE.Vector3(-5,7,-3));sKey.target.position.copy(sFork.position);}
  // shooting star
  const sp=(t%4.7)/0.9; shoot.visible=sp<1;
  if(shoot.visible){const r2=mulberry32(Math.floor(t/4.7)+5);const dir=new THREE.Vector3();sCam.getWorldDirection(dir);const right=new THREE.Vector3().crossVectors(dir,sCam.up).normalize();
    const start=sCam.position.clone().addScaledVector(dir,120).addScaledVector(right,-40+r2()*20).add(new THREE.Vector3(0,30+r2()*20,0));
    shoot.position.copy(start).addScaledVector(right,sp*70).add(new THREE.Vector3(0,-sp*20,0));shoot.lookAt(shoot.position.clone().addScaledVector(right,-1).add(new THREE.Vector3(0,0.3,0)));shoot.rotateY(Math.PI/2);shoot.material.opacity=0.9*Math.sin(Math.PI*sp);}
  sCam.lookAt(camTarget); sCam.updateProjectionMatrix();
  // labels/rings that face the camera
  [BH,BIG].forEach(b=>{b.ring.lookAt(sCam.position);b.arc.position.set(0,0,-b.RH*0.2);b.arc.lookAt(sCam.position);});
  return sc;
}
// inside the horizon (after crossing): outside light shrinks to a bright circle
function drawInside(t){
  const u=t-37.6; if(u<0||t>=44) return;
  const k=clamp(u/0.25);
  ctx.save();
  const rr=lerp(300,70,clamp(u/5)); ctx.globalAlpha=k*0.9; const c=ctx.createRadialGradient(W/2,600,0,W/2,600,rr);c.addColorStop(0,'rgba(255,240,220,0.95)');c.addColorStop(0.7,'rgba(255,190,140,0.5)');c.addColorStop(1,'rgba(255,170,120,0)');
  ctx.fillStyle=c;ctx.beginPath();ctx.arc(W/2,600,rr,0,Math.PI*2);ctx.fill(); ctx.restore();
}

/* ============================================================
   CAPTIONS + HUD
   ============================================================ */
const SCENES=[
  {t0:0,   t1:7,   pre:"Let's send one ordinary fork toward a black hole. The fork's mass:", key:'≈ 50 g', foot:''},
  {t0:7,   t1:14.5,pre:"This black hole has 10× the Sun's mass, packed inside an event horizon with a radius of", key:'≈ 30 km', foot:'Fork hugely enlarged · slow motion'},
  {t0:14.5,t1:22,  pre:'Gravity pulls the tip harder than the handle, and the difference grows fast:', key:'tidal force', foot:'Fork hugely enlarged · slow motion'},
  {t0:22,  t1:29.6,pre:'About 100 km out, the fork is ripped apart and stretched long and thin:', key:'spaghettification', foot:'≈100 km is a rough estimate for a steel fork'},
  {t0:29.6,t1:36,  pre:'Watched from far away, it seems to slow down, turn red and fade at the edge:', key:'time dilation', foot:'Its light gets stretched (redshifted) and dimmer'},
  {t0:36,  t1:44,  pre:'The fork itself just falls through. Its trip to the centre takes about', key:'0.07 ms', foot:'General relativity · nobody knows what happens at the centre'},
  {t0:44,  t1:52,  pre:'At a giant like Sagittarius A*, tides at the horizon are gentle. A fork crosses', key:'in one piece', foot:'It would be stretched only much deeper inside'},
  {t0:52,  t1:61,  pre:'Nothing comes back out. The black hole just gets heavier by', key:'≈ 50 g', foot:''},
];
function wrapText(text,maxW){const words=text.split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}
function drawCaption(t){
  const sc=SCENES.find(s=>t>=s.t0&&t<s.t1); if(!sc)return;
  const a=t-sc.t0,d=sc.t1-sc.t0;
  const ain=easeOut(a/0.55), aout=clamp((d-a)/0.22), alpha=Math.min(ain,aout);
  const grd=ctx.createLinearGradient(0,0,0,700);grd.addColorStop(0,'rgba(6,8,18,0.62)');grd.addColorStop(0.6,'rgba(6,8,18,0.22)');grd.addColorStop(1,'rgba(6,8,18,0)');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,700);
  ctx.save(); ctx.globalAlpha=alpha; ctx.translate(0,(1-ain)*-28);
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.font=`800 62px ${FONT}`;
  const lines=wrapText(sc.pre,940); let y=190;
  ctx.shadowColor='rgba(0,0,0,0.55)'; ctx.shadowBlur=22; ctx.shadowOffsetY=4; ctx.fillStyle='#ffffff';
  for(const l of lines){ctx.fillText(l,W/2,y);y+=76;}
  let fs=112; ctx.font=`900 ${fs}px ${FONT}`; let kw=ctx.measureText(sc.key).width;
  if(kw>900){fs=fs*900/kw;ctx.font=`900 ${fs}px ${FONT}`;kw=ctx.measureText(sc.key).width;}
  const bw=kw+76,bh=fs*1.3,bx=W/2-bw/2,by=y-34;
  const wipe=easeOut((a-0.3)/0.45), pop=1+0.08*Math.sin(clamp((a-0.3)/0.6)*Math.PI);
  ctx.translate(W/2,by+bh/2); ctx.rotate(-0.022); ctx.scale(pop,pop); ctx.translate(-W/2,-(by+bh/2));
  ctx.shadowColor='rgba(0,0,0,0.35)'; ctx.shadowBlur=30; ctx.shadowOffsetY=8;
  roundRectPath(ctx,bx,by,Math.max(1,bw*wipe),bh,24); ctx.fillStyle='#FFD43B'; ctx.fill();
  ctx.shadowColor='transparent'; ctx.clip();
  ctx.fillStyle='#16141f'; ctx.textBaseline='middle'; ctx.fillText(sc.key,W/2,by+bh/2+fs*0.05);
  ctx.restore();
  if(sc.foot){ctx.save();ctx.globalAlpha=alpha;ctx.font=`700 30px ${FONT}`;ctx.textAlign='center';ctx.fillStyle='rgba(235,240,255,0.75)';ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=10;ctx.fillText(sc.foot,W/2,H-64);ctx.restore();}
}
function panel(x,y,w,h,r=30){ctx.save();ctx.shadowColor='rgba(0,0,0,0.35)';ctx.shadowBlur=30;ctx.shadowOffsetY=8;roundRectPath(ctx,x,y,w,h,r);ctx.fillStyle='rgba(18,20,34,0.86)';ctx.fill();ctx.restore();}
function badge(text,xr,y,bg='#FFD43B',fg='#16141f'){ctx.font=`900 30px ${FONT}`;const w=ctx.measureText(text).width+34;roundRectPath(ctx,xr-w,y,w,48,16);ctx.fillStyle=bg;ctx.fill();ctx.fillStyle=fg;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,xr-w/2,y+25);}
const fmtMS=s=>{s=Math.max(0,Math.floor(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
const fmtInt=n=>Math.round(n).toLocaleString('en-US');
// timeline: title, speed badge, big value, progress 0..1, ticks [{p,label}], highlight when done
function drawTimeline(o,alpha){
  if(alpha<=0)return;
  const x=70,w=W-140,h=270,y=H-120-h;
  ctx.save();ctx.globalAlpha=alpha;
  panel(x,y,w,h);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.font=`700 34px ${FONT}`;ctx.fillStyle='#c9d0f2';ctx.fillText(o.title,x+36,y+58);
  badge(o.speed,x+w-30,y+24);
  ctx.textAlign='left';ctx.font=`900 96px ${FONT}`;ctx.fillStyle=o.done?'#FFD43B':'#ffffff';ctx.fillText(o.value,x+34,y+158);
  if(o.sub){ctx.font=`800 36px ${FONT}`;ctx.fillStyle=o.subColor||'#ffb3a8';ctx.textAlign='right';ctx.fillText(o.sub,x+w-36,y+150);}
  const tx=x+36,tw=w-72,ty=y+196;
  roundRectPath(ctx,tx,ty,tw,18,9);ctx.fillStyle='rgba(255,255,255,0.16)';ctx.fill();
  roundRectPath(ctx,tx,ty,Math.max(18,tw*clamp(o.p)),18,9);ctx.fillStyle='#FFD43B';ctx.fill();
  ctx.beginPath();ctx.arc(tx+tw*clamp(o.p),ty+9,17,0,Math.PI*2);ctx.fillStyle='#ffffff';ctx.fill();
  ctx.font=`700 26px ${FONT}`;ctx.fillStyle='#c9d0f2';ctx.textBaseline='alphabetic';
  for(const tk of o.ticks){const px=tx+tw*tk.p;ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fillRect(px-2,ty-8,4,34);ctx.fillStyle='#c9d0f2';ctx.textAlign=tk.p<0.05?'left':tk.p>0.95?'right':'center';ctx.fillText(tk.label,px,ty+58);}
  ctx.restore();
}
function drawCard(title,accent,items,shown,alpha,yTop){
  if(alpha<=0)return;
  const x=70,w=W-140,h=70+items.length*58,y=yTop??(H-120-270-30-h);
  ctx.save();ctx.globalAlpha=alpha;panel(x,y,w,h,28);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.font=`900 36px ${FONT}`;ctx.fillStyle=accent;ctx.fillText(title,x+34,y+54);
  items.forEach((it,i)=>{const a=clamp(shown[i]);if(a<=0)return;ctx.globalAlpha=alpha*a;const yy=y+108+i*58;
    roundRectPath(ctx,x+34,yy-32,38,38,10);ctx.fillStyle=accent;ctx.fill();ctx.fillStyle='#16141f';ctx.font=`900 30px ${FONT}`;ctx.textAlign='center';ctx.fillText(it.icon||'✓',x+53,yy-2);
    ctx.textAlign='left';ctx.font=`800 38px ${FONT}`;ctx.fillStyle='#ffffff';ctx.fillText(it.text,x+92,yy);});
  ctx.restore();
}
const NOHUD = params.has('nohud') || params.has('cover');
function drawCover(){
  const g=ctx.createLinearGradient(0,980,0,1920);g.addColorStop(0,'rgba(6,8,18,0)');g.addColorStop(0.45,'rgba(6,8,18,0.55)');g.addColorStop(1,'rgba(6,8,18,0.8)');
  ctx.fillStyle=g;ctx.fillRect(0,980,W,940);
  ctx.save();ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=26;ctx.shadowOffsetY=6;ctx.fillStyle='#ffffff';
  {let f1=96;ctx.font=`900 ${f1}px ${FONT}`;const w1=ctx.measureText('WHAT IF A FORK FELL').width;if(w1>940){f1*=940/w1;ctx.font=`900 ${f1}px ${FONT}`;}}ctx.fillText('WHAT IF A FORK FELL',W/2,1220);
  let fs=124;ctx.font=`900 ${fs}px ${FONT}`;let kw=ctx.measureText('INTO A BLACK HOLE?').width;if(kw>960){fs*=960/kw;ctx.font=`900 ${fs}px ${FONT}`;kw=960;}
  const bw=kw+70,bh=fs*1.3,by=1265;
  ctx.translate(W/2,by+bh/2);ctx.rotate(-0.03);ctx.translate(-W/2,-(by+bh/2));
  ctx.shadowColor='rgba(0,0,0,0.4)';ctx.shadowBlur=34;ctx.shadowOffsetY=10;
  roundRectPath(ctx,W/2-bw/2,by,bw,bh,28);ctx.fillStyle='#FFD43B';ctx.fill();
  ctx.shadowColor='transparent';ctx.fillStyle='#16141f';ctx.textBaseline='middle';ctx.fillText('INTO A BLACK HOLE?',W/2,by+bh/2+fs*0.05);
  ctx.restore();
  ctx.save();ctx.textAlign='center';ctx.font=`800 52px ${FONT}`;ctx.fillStyle='#ffffff';ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=18;
  ctx.fillText('Spoiler: it becomes spaghetti',W/2,1545);ctx.restore();
}
function dial(cx,cy,r,ang,label,col){
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#fff8ea';ctx.fill();ctx.lineWidth=8;ctx.strokeStyle=col;ctx.stroke();
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;ctx.beginPath();ctx.moveTo(cx+Math.sin(a)*r*0.78,cy-Math.cos(a)*r*0.78);ctx.lineTo(cx+Math.sin(a)*r*0.9,cy-Math.cos(a)*r*0.9);ctx.lineWidth=5;ctx.strokeStyle='#16141f';ctx.stroke();}
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.sin(ang)*r*0.72,cy-Math.cos(ang)*r*0.72);ctx.lineWidth=9;ctx.lineCap='round';ctx.strokeStyle=col;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,9,0,Math.PI*2);ctx.fillStyle='#16141f';ctx.fill();
  ctx.font=`800 30px ${FONT}`;ctx.textAlign='center';ctx.fillStyle='#ffffff';ctx.fillText(label[0],cx,cy+r+46);ctx.font=`700 24px ${FONT}`;ctx.fillStyle='#c9d0f2';ctx.fillText(label[1],cx,cy+r+78);ctx.restore();
}
function drawClocks(t,alpha){
  if(alpha<=0)return; const u=t-29.6; const x=70,w=W-140,h=360,y=H-110-h;
  ctx.save();ctx.globalAlpha=alpha;panel(x,y,w,h);
  ctx.textAlign='left';ctx.font=`700 32px ${FONT}`;ctx.fillStyle='#c9d0f2';ctx.fillText('WHAT YOU SEE FROM FAR AWAY',x+36,y+54);
  dial(x+w*0.27,y+175,92,u*Math.PI,['YOUR CLOCK','ticks normally'],'#8fd0ff');
  const fa=Math.PI*(1-Math.exp(-0.85*u))/0.85;
  dial(x+w*0.73,y+175,92,fa,["THE FORK'S CLOCK",'seems to freeze'],u>2?'#ff5a4a':'#FFD43B');
  ctx.restore();
}

function renderAt(t){
  t=((t%DUR)+DUR)%DUR;
  if(t<7){updateKitchen(t);renderer.render(kScene,kCam);} else {updateSpace(t);renderer.render(sScene,sCam);}
  ctx.globalAlpha=1; ctx.drawImage(glCanvas,0,0,W,H);
  drawInside(t);
  if(NOHUD){ if(params.has('cover')) drawCover(); return; }
  drawCaption(t);
  if(t>=7.3&&t<29.6){
    const km=rKm(t), tp=tPhys(km), dt=0.05, d1=tPhys(rKm(t))-tPhys(rKm(Math.max(7,t-dt)));
    const slow=d1>1e-6?(1000*dt)/d1:0;
    const pr=x=>(Math.log(1000)-Math.log(x))/(Math.log(1000)-Math.log(29.5));
    drawTimeline({title:'DISTANCE TO THE CENTRE',speed:slow>0?`SLOW-MO ≈${sigfig(slow)}×`:'SLOW-MO',value:`${sigfig(km)} km`,p:pr(km),done:km<=100,
      sub:`t = ${tp.toFixed(1)} ms`,subColor:'#ffb3a8',ticks:[{p:0,label:'1,000 km'},{p:pr(100),label:'≈100 km: torn'},{p:1,label:'30 km horizon'}]},clamp((t-7.3)/0.4)*clamp((29.6-t)/0.25));
  }
  if(t>=29.8&&t<36) drawClocks(t,clamp((t-29.8)/0.4)*clamp((36-t)/0.25));
  if(t>=37.7&&t<44){const p=clamp((t-37.7)/5.6);
    drawTimeline({title:"FORK'S OWN CLOCK, INSIDE",speed:'SLOW-MO ≈85,000×',value:`${(0.066*p).toFixed(3)} ms`,p,done:p>=1,sub:p>=1?'CENTRE':'',subColor:'#FFD43B',ticks:[{p:0,label:'horizon'},{p:1,label:'centre ≈0.07 ms'}]},clamp((t-37.7)/0.3)*clamp((44-t)/0.25));}
  let fade=0;
  for(const c of [7,29.6,36,44,52]) fade=Math.max(fade,1-Math.abs(t-c)/0.22);
  fade=Math.max(fade,1-t/0.45, 1-(DUR-t)/0.6);
  if(fade>0){ctx.fillStyle=`rgba(4,5,10,${clamp(fade)})`;ctx.fillRect(0,0,W,H);}
}
window.renderAt=renderAt;

/* ============================================================
   PLAYBACK / RECORDING
   ============================================================ */
let playing=true, t0=performance.now(), pausedAt=0;
const bPlay=document.getElementById('bPlay'), bRec=document.getElementById('bRec');
function now(){return playing?(performance.now()-t0)/1000:pausedAt;}
function togglePlay(){if(playing){pausedAt=now();playing=false;bPlay.textContent='Play';}else{t0=performance.now()-pausedAt*1000;playing=true;bPlay.textContent='Pause';}}
bPlay.onclick=togglePlay;
document.getElementById('bRestart').onclick=()=>{t0=performance.now();pausedAt=0;if(!playing)togglePlay();};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();togglePlay();}});
bRec.onclick=()=>{
  if(!window.MediaRecorder){alert('MediaRecorder not supported in this browser.');return;}
  const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  const mime=types.find(m=>MediaRecorder.isTypeSupported(m))||'';
  const rec=new MediaRecorder(out.captureStream(30),{mimeType:mime,videoBitsPerSecond:16e6});
  const chunks=[]; rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='fork-black-hole.webm';a.click();bRec.disabled=false;bRec.textContent='Record 61s WebM';};
  t0=performance.now(); if(!playing) togglePlay();
  rec.start(); bRec.disabled=true; bRec.textContent='Recording…';
  setTimeout(()=>rec.stop(),DUR*1000+150);
};

if(fixedT!==null){ renderAt(fixedT); window.__ready=true; }
else { (function loop(){renderAt(now()%DUR);requestAnimationFrame(loop);})(); window.__ready=true; }
})();
