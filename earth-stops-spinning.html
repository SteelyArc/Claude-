<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>If Earth Stopped Spinning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0e16; --btn:#1d2233; --btnText:#e8ecff; }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #out{display:block;height:100vh;width:calc(100vh * 9 / 16);max-width:100vw;max-height:calc(100vw * 16 / 9);background:#000}
  #ui{position:fixed;right:12px;bottom:12px;display:flex;gap:8px;font:600 13px/1 system-ui,sans-serif}
  #ui button{background:var(--btn);color:var(--btnText);border:1px solid #39405a;border-radius:8px;padding:9px 12px;cursor:pointer}
  #ui button:hover{background:#2a3150}
  #ui.hidden{display:none}
</style>
</head>
<body>
<div id="stage"><canvas id="out" width="1080" height="1920"></canvas></div>
<div id="ui">
  <button id="bPlay">Pause</button>
  <button id="bRestart">Restart</button>
  <button id="bRec">Record 60s WebM</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
"use strict";
/* ============================================================
   IF EARTH STOPPED SPINNING — 60 s vertical (1080x1920) three.js
   Facts used (all real):
   - Equator surface speed: 2π·6378 km / 23.93 h ≈ 1,670 km/h ≈ 465 m/s
   - Speed of sound (20 °C, sea level) ≈ 343 m/s
   - Strongest tornado wind measured: ≈ 484 km/h (301 mph, Bridge Creek–Moore, 1999)
   - Speed ∝ cos(latitude): ≈ 1,180 km/h at 45°, ≈ 0 at the poles
   - No rotation → one solar day = one year (≈6 months light, 6 months dark)
   - Equatorial bulge ≈ 21 km; without spin the oceans migrate to the poles,
     leaving one equatorial super-continent (ESRI model, W. Fraczek)
   ============================================================ */

const W = 1080, H = 1920, DUR = 60;
const params = new URLSearchParams(location.search);
const fixedT = params.has('t') ? parseFloat(params.get('t')) : null;
if (params.has('clean') || fixedT !== null) document.getElementById('ui').classList.add('hidden');

// ---------- utils ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(20261122);
const R = (a,b)=>a+(b-a)*rnd();
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x);};
const easeOut=x=>1-Math.pow(1-clamp(x),3);
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(rnd()*a.length)];
const lin=h=>new THREE.Color(h).convertSRGBToLinear();
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:lin(c),roughness:0.82,metalness:0},o));
const wrapS=(x,s)=>((x+s/2)%s+s)%s-s/2;

// wait for fonts (canvas text) but never hang
try{ await Promise.race([Promise.all([document.fonts.load('900 100px Archivo'),document.fonts.load('800 60px Archivo'),document.fonts.load('700 40px Archivo')]),new Promise(r=>setTimeout(r,2500))]); }catch(e){}
const FONT='Archivo, "Helvetica Neue", Arial, sans-serif';

// ---------- renderer & output ----------
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(1);
renderer.setSize(W,H,false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const glCanvas = renderer.domElement;
const out = document.getElementById('out');
const ctx = out.getContext('2d');

// ---------- geometry helpers ----------
function rrShape(w,h,r){
  const s=new THREE.Shape(), x=-w/2, y=-h/2; r=Math.max(0.001,Math.min(r,w/2-0.001,h/2-0.001));
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s;
}
function rbox(w,h,d,r=0.1){
  const b=Math.min(r,w/2.2,h/2.2,d/2.2);
  const g=new THREE.ExtrudeGeometry(rrShape(w-2*b,h-2*b,b*0.8),{depth:Math.max(0.002,d-2*b),bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:3,curveSegments:4});
  g.translate(0,0,-Math.max(0.002,d-2*b)/2);
  return g;
}
function shadowed(o,cast=true,recv=true){o.traverse(m=>{if(m.isMesh){m.castShadow=cast;m.receiveShadow=recv;}});return o;}

function canvasTex(w,h,draw,repeat){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat[0],repeat[1]);}
  return t;
}
function roundRectPath(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

// In-world label (sprite). lines: [small, big]
function makeLabel(small,big,{accent='#FFD43B',worldH=1.0}={}){
  const c=document.createElement('canvas'), g=c.getContext('2d');
  const s1=44,s2=74,pad=30;
  g.font=`700 ${s1}px ${FONT}`; const w1=small?g.measureText(small).width:0;
  g.font=`900 ${s2}px ${FONT}`; const w2=g.measureText(big).width;
  c.width=Math.ceil(Math.max(w1,w2)+pad*2); c.height=Math.ceil((small?s1*1.25:0)+s2*1.2+pad*1.6);
  function draw(sm,bg){
    g.clearRect(0,0,c.width,c.height);
    roundRectPath(g,4,4,c.width-8,c.height-8,26); g.fillStyle='rgba(18,20,34,0.86)'; g.fill();
    g.textAlign='center'; g.textBaseline='top';
    let y=pad*0.8;
    if(sm){g.font=`700 ${s1}px ${FONT}`;g.fillStyle='#c9d0f2';g.fillText(sm,c.width/2,y);y+=s1*1.25;}
    g.font=`900 ${s2}px ${FONT}`;g.fillStyle=accent;g.fillText(bg,c.width/2,y);
  }
  draw(small,big);
  const tex=new THREE.CanvasTexture(c);tex.encoding=THREE.sRGBEncoding;tex.anisotropy=8;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false,fog:false,toneMapped:false}));
  sp.renderOrder=20; sp.scale.set(worldH*c.width/c.height,worldH,1);
  sp.userData.redraw=(a,b)=>{draw(a,b);tex.needsUpdate=true;};
  return sp;
}

/* ============================================================
   GROUND WORLD (scenes 1–5)
   ============================================================ */
const gScene=new THREE.Scene();
gScene.background=canvasTex(4,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#5d9ee0');gr.addColorStop(0.55,'#a9cdee');gr.addColorStop(0.82,'#f3dcc0');gr.addColorStop(1,'#f6e6d2');g.fillStyle=gr;g.fillRect(0,0,w,h);});
gScene.fog=new THREE.Fog(lin('#eedfcd'),35,120);
const gCam=new THREE.PerspectiveCamera(55,W/H,0.1,500);
const gHemi=new THREE.HemisphereLight(lin('#d6e8ff'),lin('#8d9a6c'),0.55); gScene.add(gHemi);
const gSun=new THREE.DirectionalLight(lin('#fff0d8'),2.7);
gSun.castShadow=true; gSun.shadow.mapSize.set(2048,2048);
Object.assign(gSun.shadow.camera,{left:-34,right:34,top:34,bottom:-34,near:1,far:140});
gSun.shadow.bias=-0.0004; gSun.shadow.normalBias=0.03; gSun.shadow.radius=4;
gScene.add(gSun,gSun.target);

// ground + road with scrolling textures
const TILE=16, ROADTILE=8;
const groundTex=canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#a6d18a';g.fillRect(0,0,w,h);
  const cols=['#9ccb80','#b2d892','#a0cf86','#bcdc98','#96c57c'];
  const r2=mulberry32(5);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){g.fillStyle=cols[Math.floor(r2()*cols.length)];g.fillRect(i*128+3,j*128+3,122,122);}
  g.strokeStyle='rgba(255,255,255,0.10)';g.lineWidth=2;
  for(let i=0;i<4;i++)for(let k=0;k<6;k++){g.beginPath();g.moveTo(i*128+10,k*21+r2()*4+i%2*256);g.lineTo(i*128+118,k*21+i%2*256);g.stroke();}
},[600/TILE,600/TILE]);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshStandardMaterial({map:groundTex,roughness:0.95}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; gScene.add(ground);
const roadTex=canvasTex(256,128,(g,w,h)=>{
  g.fillStyle='#e6ddd0';g.fillRect(0,0,w,h);           // sidewalks
  g.fillStyle='#8a8d9c';g.fillRect(0,18,w,92);          // asphalt
  g.fillStyle='#ffe08a';g.fillRect(20,61,96,6);         // dash
},[600/ROADTILE,1]);
const road=new THREE.Mesh(new THREE.PlaneGeometry(600,5.4),new THREE.MeshStandardMaterial({map:roadTex,roughness:0.9}));
road.rotation.x=-Math.PI/2; road.position.set(0,0.012,1); road.receiveShadow=true; gScene.add(road);

// palettes
const WALLS=['#f6e5cb','#f7cdb9','#d3e3f6','#ead9f3','#fff1d6','#cfeedd'];
const ROOFS=['#e0736a','#6d8fd8','#8a6aa6','#e7965c','#4fb3a2'];
const CARS=['#ff6b6b','#4ecdc4','#ffd166','#5e7ce2','#f78fb3','#ffffff'];
const SHIRTS=['#ff7f6e','#5fa8ff','#ffd166','#8bd17c','#c38bff','#ff9fd1'];
const LEAVES=['#6cbf72','#86cc69','#5aae6a','#9fd46e'];
const M={wall:WALLS.map(c=>mat(c)),roof:ROOFS.map(c=>mat(c,{roughness:0.7})),car:CARS.map(c=>mat(c,{roughness:0.45})),
  shirt:SHIRTS.map(c=>mat(c)),leaf:LEAVES.map(c=>mat(c,{roughness:0.9})),trunk:mat('#9a6a48'),dark:mat('#33364a',{roughness:0.6}),
  glass:mat('#bfe3ff',{roughness:0.25}),found:mat('#cbbfae'),skin:mat('#f2c4a2'),stump:mat('#7e5636'),white:mat('#ffffff'),cloud:mat('#ffffff',{roughness:1})};
const GEO={
  houseBody:rbox(2.4,1.9,2.4,0.14),
  roof:(()=>{const g=new THREE.CylinderGeometry(1.7,1.7,2.8,3,1);g.rotateX(-Math.PI/2);g.scale(1,0.55,1);return g;})(),
  door:new THREE.BoxGeometry(0.5,0.85,0.06), win:new THREE.BoxGeometry(0.5,0.45,0.06),
  chimney:rbox(0.34,0.8,0.34,0.05), found:rbox(2.9,0.18,2.9,0.06),
  trunk:new THREE.CylinderGeometry(0.13,0.18,1.3,10), canopy:new THREE.IcosahedronGeometry(0.95,2), stump:new THREE.CylinderGeometry(0.19,0.22,0.22,10),
  carBody:rbox(1.9,0.55,0.95,0.16), carCab:rbox(1.0,0.5,0.85,0.16), wheel:new THREE.CylinderGeometry(0.2,0.2,0.16,16).rotateX(Math.PI/2),
  body:new THREE.CylinderGeometry(0.15,0.19,0.55,12), head:new THREE.SphereGeometry(0.15,16,12),
  puff:new THREE.SphereGeometry(1,16,12), cloud:new THREE.SphereGeometry(1,18,12)
};

function makeHouse(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(GEO.houseBody,pick(M.wall)); body.position.y=0.95; g.add(body);
  const roof=new THREE.Mesh(GEO.roof,pick(M.roof)); roof.position.y=1.9+0.46; g.add(roof);
  const door=new THREE.Mesh(GEO.door,M.dark); door.position.set(-0.45,0.43,1.2); g.add(door);
  const w1=new THREE.Mesh(GEO.win,M.glass); w1.position.set(0.5,1.05,1.2); g.add(w1);
  const ch=new THREE.Mesh(GEO.chimney,M.wall[0]); ch.position.set(0.7,2.5,-0.4); g.add(ch);
  return shadowed(g);
}
function makeTree(s){
  const g=new THREE.Group();
  const tr=new THREE.Mesh(GEO.trunk,M.trunk); tr.position.y=0.65+0.2; g.add(tr);
  const c=new THREE.Mesh(GEO.canopy,pick(M.leaf)); c.position.y=1.85; c.scale.set(1,1.15,1); g.add(c);
  g.scale.setScalar(s); return shadowed(g);
}
function makeCar(m){
  const g=new THREE.Group();
  const b=new THREE.Mesh(GEO.carBody,m||pick(M.car)); b.position.y=0.48; g.add(b);
  const c=new THREE.Mesh(GEO.carCab,M.glass); c.position.set(-0.1,0.9,0); g.add(c);
  for(const [x,z] of [[-0.6,0.45],[0.6,0.45],[-0.6,-0.45],[0.6,-0.45]]){const w=new THREE.Mesh(GEO.wheel,M.dark);w.position.set(x,0.2,z);g.add(w);}
  return shadowed(g);
}
function makePerson(){
  const g=new THREE.Group();
  const b=new THREE.Mesh(GEO.body,pick(M.shirt)); b.position.y=0.28; g.add(b);
  const h=new THREE.Mesh(GEO.head,M.skin); h.position.y=0.7; g.add(h);
  return shadowed(g);
}
function makeCloud(){
  const g=new THREE.Group();
  for(let i=0;i<5;i++){const s=new THREE.Mesh(GEO.cloud,M.cloud);s.position.set(R(-2.2,2.2),R(-0.3,0.5),R(-0.8,0.8));s.scale.setScalar(R(1.0,1.8));g.add(s);}
  g.scale.set(1.3,0.8,1); return g;
}

// carousel: everything rides the ground until it stops
const SPAN=120, V=16, T_STOP=9.2;
const items=[], puffs=[];
function addItem(loose,anchor,x0,z,kind,o={}){
  loose.position.set(x0,o.baseY||0,z); loose.rotation.y=o.ry||0; gScene.add(loose);
  if(anchor){anchor.position.set(x0,0,z);gScene.add(anchor);}
  const lift={house:R(0.6,2.0),tree:R(1.0,3.2),car:R(1.5,4.5),person:R(2.5,6.5)}[kind];
  const sp={house:[R(-.25,.25),R(-.3,.3),R(-.7,-.25)],tree:[R(-.4,.4),R(-.3,.3),R(-1.6,-.6)],car:[R(-2,2),R(-1.5,1.5),R(-2.5,-.5)],person:[R(-3,3),R(-2,2),R(-4,-1)]}[kind];
  items.push({loose,anchor,x0,z,kind,baseY:o.baseY||0,ry:o.ry||0,lift,spin:new THREE.Vector3(...sp),delay:R(0,0.15),ph:R(0,6.28)});
}
// houses (two rows)
for(let i=0;i<16;i++){const x=-60+i*7.5+R(-1,1),z=R(-7.5,-5.5);const f=shadowed(new THREE.Mesh(GEO.found,M.found),false,true);f.position.y=0.09;const a=new THREE.Group();a.add(f);addItem(makeHouse(),a,x,z,'house',{baseY:0.18,ry:R(-0.15,0.15)});}
for(let i=0;i<12;i++){const x=-60+i*10+R(-1.5,1.5),z=R(-18,-15);const f=shadowed(new THREE.Mesh(GEO.found,M.found),false,true);f.position.y=0.09;const a=new THREE.Group();a.add(f);addItem(makeHouse(),a,x,z,'house',{baseY:0.18,ry:R(-0.4,0.4)});}
// trees (rows + foreground)
function treeAt(x,z,s){const st=shadowed(new THREE.Mesh(GEO.stump,M.stump));st.position.y=0.11;st.scale.setScalar(s);const a=new THREE.Group();a.add(st);addItem(makeTree(s),a,x,z,'tree');}
for(let i=0;i<16;i++) treeAt(-60+i*7.5+3.7+R(-0.6,0.6),R(-9.5,-3.5),R(0.8,1.15));
for(let i=0;i<14;i++) treeAt(-60+i*8.6+R(-1,1),R(-24,-20),R(1.0,1.4));
for(let i=0;i<7;i++)  treeAt(-60+i*17+R(-2,2),R(5.5,7.5),R(0.9,1.2));
// cars on the road, people on the sidewalk
for(let i=0;i<10;i++) addItem(makeCar(),null,-60+i*12+R(-2,2),i%2?0.1:1.9,'car',{ry:i%2?Math.PI:0});
for(let i=0;i<16;i++) addItem(makePerson(),null,-60+i*7.5+R(-2,2),R(3.6,4.1),'person');
// a dust puff at every house foundation
for(const it of items) if(it.kind==='house'){const m=new THREE.Mesh(GEO.puff,new THREE.MeshStandardMaterial({color:lin('#e9dccb'),roughness:1,transparent:true,opacity:0,depthWrite:false}));gScene.add(m);puffs.push({m,it});}
// clouds ride with the atmosphere
const clouds=[];
for(let i=0;i<12;i++){const c=makeCloud();c.position.set(0,R(11,19),R(-45,-15));gScene.add(c);clouds.push({c,x0:R(-70,70)});}

// ---- scene 3: hero car + sound wavefronts ----
const heroCar=makeCar(M.car[0]); heroCar.scale.setScalar(1.25); gScene.add(heroCar);
const VC=6, CS=VC*343/465;   // debris speed vs sound speed, true ratio (Mach 1.36)
const ringMat=()=>new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uR:{value:1},uS:{value:3},uO:{value:1},uC:{value:new THREE.Color('#eaf4ff')}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform float uR,uS,uO;uniform vec3 uC;varying vec2 vUv;void main(){vec2 p=(vUv-0.5)*uS;float d=abs(length(p)-uR);float a=1.0-smoothstep(0.025,0.07,d);gl_FragColor=vec4(uC,a*uO);}'});
const rings=[]; const RING_DT=0.12, RING_LIFE=1.9;
for(let k=0;k<70;k++){const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),ringMat());m.renderOrder=5;gScene.add(m);rings.push(m);}
const shockMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.8,depthWrite:false,toneMapped:false});
const shockLines=[0,1].map(()=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(1,0.07).translate(-0.5,0,0),shockMat);gScene.add(m);return m;});
const soundDot=new THREE.Mesh(new THREE.SphereGeometry(0.16,16,12),new THREE.MeshBasicMaterial({color:lin('#8fd0ff'),toneMapped:false}));gScene.add(soundDot);
const lblCar=makeLabel('DEBRIS','465 m/s',{accent:'#FFD43B',worldH:1.15}); gScene.add(lblCar);
const lblSound=makeLabel('SOUND','343 m/s',{accent:'#8fd0ff',worldH:1.0}); gScene.add(lblSound);
const lblBoom=makeLabel(null,'SONIC BOOM',{accent:'#ffffff',worldH:0.6}); gScene.add(lblBoom);

// ---- scene 4: wind ----
const streakGeo=new THREE.BoxGeometry(1,0.035,0.035);
const streaks=new THREE.InstancedMesh(streakGeo,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.55,depthWrite:false}),420);
const streakData=[];for(let i=0;i<420;i++)streakData.push({x0:R(-40,40),y:R(0.15,10),z:R(-28,8),l:R(1.2,4.2),s:R(0.8,1.25)});
gScene.add(streaks);
const tufts=[];const tuftGeo=new THREE.ConeGeometry(0.07,0.7,6).translate(0,0.35,0);
for(let i=0;i<170;i++){const m=new THREE.Mesh(tuftGeo,pick(M.leaf));m.position.set(R(-5,5),0,R(-1.5,6));m.scale.setScalar(R(0.45,0.9));m.castShadow=true;gScene.add(m);tufts.push({m,ph:R(0,6.28)});}
const debris=[];
for(let i=0;i<46;i++){const g=pick([rbox(0.5,0.08,0.3,0.03),rbox(0.25,0.25,0.25,0.05),rbox(0.9,0.06,0.18,0.02)]);const m=new THREE.Mesh(g,pick([...M.roof,...M.wall,M.trunk]));m.castShadow=true;gScene.add(m);debris.push({m,x0:R(-30,30),y:R(0.6,7),z:R(-14,5),sp:R(0.8,1.3),r:new THREE.Vector3(R(-6,6),R(-6,6),R(-6,6))});}
const BAR_MAX=4.1;
const barT=shadowed(new THREE.Mesh(rbox(1.35,1,1.35,0.12),mat('#9aa7c4'))); barT.position.set(-1.35,0,-2.5); gScene.add(barT);
const barE=shadowed(new THREE.Mesh(rbox(1.35,1,1.35,0.12),mat('#ff6b5a'))); barE.position.set(1.35,0,-2.5); gScene.add(barE);
const lblBarT=makeLabel('STRONGEST TORNADO','484 km/h',{accent:'#d5defa',worldH:0.85}); gScene.add(lblBarT);
const lblBarE=makeLabel('STOPPED EARTH','1,670 km/h',{accent:'#FFD43B',worldH:0.95}); gScene.add(lblBarE);

// ---- scene 5: ocean surge ----
const WNU=100,WNZ=90,WZ0=-90,WZ1=40;
const waveGeo=new THREE.PlaneGeometry(1,1,WNU-1,WNZ-1);

    lblEq.position.set(1.45,-0.95,GR+BULGE+0.4); lblEq.material.opacity=clamp((a-1.0)/0.4);
    const p45=Math.PI/4, r45=GR+BULGE*0.5+0.32;
    lbl45.position.set(1.75,r45*Math.sin(p45)+0.75,r45*Math.cos(p45)+0.3); lbl45.material.opacity=clamp((a-1.7)/0.4);
    lblPole.position.set(-1.6,GR+1.05,0.2); lblPole.material.opacity=clamp((a-2.6)/0.4);
    sCam.position.set(-0.6+0.12*a,-1.2+0.12*a,23.5-0.3*a); sCam.lookAt(0.35,0.9,0);
    sLight.position.set(-12,9,12); sLight.target.position.set(0,0,0); sLight.intensity=3.0; sHemi.intensity=0.32;
  } else if(sc===7){
    const a=t-47, f=clamp((a-0.35)/6.3), ang=-Math.PI/2+f*Math.PI*2;
    const E=tmpV.set(-RO*Math.sin(ang), 0, -RO*Math.cos(ang));  // counter-clockwise seen from north
    globe.scale.setScalar(0.24); globe.position.copy(E); globe.rotation.set(0,0,0); setOcean(0);
    // is the pin (fixed +z) facing the sun?
    const lit = (-E.z/RO) > 0.0;
    const month=Math.min(12,Math.floor(f*12)+1);
    const key=month+(lit?'d':'n');
    if(key!==dayKey){dayKey=key;lblDay.userData.redraw(`MONTH ${month}`,lit?'DAYLIGHT':'NIGHT');}
    lblDay.position.set(E.x*0.82,E.y+1.55,E.z);
    sunBall.scale.setScalar(1+0.02*Math.sin(t*4));
    sCam.position.set(0,7.5,17.5); sCam.lookAt(0,-0.6,0);
    sLight.position.set(0,0,0); sLight.target.position.copy(E); sLight.intensity=3.4; sHemi.intensity=0.07;
  } else {
    const a=t-54;
    globe.scale.setScalar(1); globe.position.set(0,0,0); globe.rotation.set(0,0.55*7,0);
    setOcean(ease((a-0.6)/3.6));
    const ca=lerp(-0.55,0.35,a/6);
    sCam.position.set(19*Math.sin(ca),1.6,19*Math.cos(ca)); sCam.lookAt(0,0.7,0);
    sLight.position.set(-11,7,11); sLight.target.position.set(0,0,0); sLight.intensity=3.0; sHemi.intensity=0.32;
  }
}

function renderAt(t){
  t=((t%DUR)+DUR)%DUR;
  const ground = t<40;
  if(ground){updateGround(t);renderer.render(gScene,gCam);} else {updateSpace(t);renderer.render(sScene,sCam);}
  ctx.globalAlpha=1; ctx.drawImage(glCanvas,0,0,W,H);
  // ocean covering the lens just before the cut
  if(t>39.2&&t<40){ctx.fillStyle=`rgba(40,130,175,${clamp((t-39.2)/0.6)})`;ctx.fillRect(0,0,W,H);}
  drawCaption(t);
  if(t>=54) drawFootnote('Bulge height exaggerated for visibility',clamp((t-55)/0.5)*clamp((59.6-t)/0.3));
  // cuts
  let fade=0;
  for(const c of [16,24,32,47,54]) fade=Math.max(fade,1-Math.abs(t-c)/0.22);
  fade=Math.max(fade,1-t/0.45, 1-(DUR-t)/0.45);
  if(t>=40&&t<40.4) fade=Math.max(fade,1-(t-40)/0.4);
  if(fade>0){ctx.fillStyle=`rgba(4,5,10,${clamp(fade)})`;ctx.fillRect(0,0,W,H);}
}
window.renderAt=renderAt;

/* ============================================================
   PLAYBACK / RECORDING
   ============================================================ */
let playing=true, t0=performance.now(), pausedAt=0;
const bPlay=document.getElementById('bPlay'), bRec=document.getElementById('bRec');
function now(){return playing?(performance.now()-t0)/1000:pausedAt;}
function togglePlay(){if(playing){pausedAt=now();playing=false;bPlay.textContent='Play';}else{t0=performance.now()-pausedAt*1000;playing=true;bPlay.textContent='Pause';}}
bPlay.onclick=togglePlay;
document.getElementById('bRestart').onclick=()=>{t0=performance.now();pausedAt=0;if(!playing)togglePlay();};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();togglePlay();}});
bRec.onclick=()=>{
  if(!window.MediaRecorder){alert('MediaRecorder not supported in this browser.');return;}
  const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  const mime=types.find(m=>MediaRecorder.isTypeSupported(m))||'';
  const rec=new MediaRecorder(out.captureStream(30),{mimeType:mime,videoBitsPerSecond:16e6});
  const chunks=[]; rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='earth-stops-spinning.webm';a.click();bRec.disabled=false;bRec.textContent='Record 60s WebM';};
  t0=performance.now(); if(!playing) togglePlay();
  rec.start(); bRec.disabled=true; bRec.textContent='Recording…';
  setTimeout(()=>rec.stop(),DUR*1000+150);
};

if(fixedT!==null){ renderAt(fixedT); window.__ready=true; }
else { (function loop(){renderAt(now()%DUR);requestAnimationFrame(loop);})(); window.__ready=true; }
})();
</script>
