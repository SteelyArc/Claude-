<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>If the Sun Disappeared</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0e16; --btn:#1d2233; --btnText:#e8ecff; }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #out{display:block;height:100vh;width:calc(100vh * 9 / 16);max-width:100vw;max-height:calc(100vw * 16 / 9);background:#000}
  #ui{position:fixed;right:12px;bottom:12px;display:flex;gap:8px;font:600 13px/1 system-ui,sans-serif}
  #ui button{background:var(--btn);color:var(--btnText);border:1px solid #39405a;border-radius:8px;padding:9px 12px;cursor:pointer}
  #ui button:hover{background:#2a3150}
  #ui.hidden{display:none}
</style>
</head>
<body>
<div id="stage"><canvas id="out" width="1080" height="1920"></canvas></div>
<div id="ui">
  <button id="bPlay">Pause</button>
  <button id="bRestart">Restart</button>
  <button id="bRec">Record 61s WebM</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
"use strict";
/* ============================================================
   IF THE SUN DISAPPEARED — 61 s vertical (1080x1920) three.js
   Facts used (all real):
   - Sunlight needs ≈ 8 min 20 s (≈ 499 s) to cross 1 AU.
   - Changes in gravity also travel at the speed of light (≈ 300,000 km/s),
     so Earth keeps orbiting until the last light arrives.
   - Earth's orbital speed ≈ 29.8 km/s; with no pull it continues in a
     straight line tangent to its old orbit (Newton's first law).
   - With no sunlight the sky turns black (no scattered light) and stars show.
   - Oceans and air store heat: cooling is gradual. Published estimates:
     global average ≈ −18 °C after about a week, ≈ −73 °C after about a year.
   ============================================================ */

const W = 1080, H = 1920, DUR = 61;
const T_V = 7.8;            // Sun vanishes
const T_OUT = 31.0;         // last sunlight (8 min 20 s later in story time)
const LIGHT_S = 500;        // 8 min 20 s
const SPEEDUP = LIGHT_S/(T_OUT-T_V);   // ≈ 21.6×
const params = new URLSearchParams(location.search);
const fixedT = params.has('t') ? parseFloat(params.get('t')) : null;
if (params.has('clean') || fixedT !== null) document.getElementById('ui').classList.add('hidden');

// ---------- utils ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(20261122);
const R = (a,b)=>a+(b-a)*rnd();
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x);};
const easeOut=x=>1-Math.pow(1-clamp(x),3);
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(rnd()*a.length)];
const lin=h=>new THREE.Color(h).convertSRGBToLinear();
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:lin(c),roughness:0.82,metalness:0},o));
const wrapS=(x,s)=>((x+s/2)%s+s)%s-s/2;

try{ await Promise.race([Promise.all([document.fonts.load('900 100px Archivo'),document.fonts.load('800 60px Archivo'),document.fonts.load('700 40px Archivo')]),new Promise(r=>setTimeout(r,2500))]); }catch(e){}
const FONT='Archivo, "Helvetica Neue", Arial, sans-serif';

// ---------- renderer & output ----------
const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(1);
renderer.setSize(W,H,false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const glCanvas = renderer.domElement;
const out = document.getElementById('out');
const ctx = out.getContext('2d');

// ---------- geometry helpers (same as the original) ----------
function rrShape(w,h,r){
  const s=new THREE.Shape(), x=-w/2, y=-h/2; r=Math.max(0.001,Math.min(r,w/2-0.001,h/2-0.001));
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s;
}
function rbox(w,h,d,r=0.1){
  const b=Math.min(r,w/2.2,h/2.2,d/2.2);
  const g=new THREE.ExtrudeGeometry(rrShape(w-2*b,h-2*b,b*0.8),{depth:Math.max(0.002,d-2*b),bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:3,curveSegments:4});
  g.translate(0,0,-Math.max(0.002,d-2*b)/2);
  return g;
}
function shadowed(o,cast=true,recv=true){o.traverse(m=>{if(m.isMesh){m.castShadow=cast;m.receiveShadow=recv;}});return o;}
function canvasTex(w,h,draw,repeat){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat[0],repeat[1]);}
  return t;
}
function roundRectPath(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function makeLabel(small,big,{accent='#FFD43B',worldH=1.0}={}){
  const c=document.createElement('canvas'), g=c.getContext('2d');
  const s1=44,s2=74,pad=30;
  function measure(sm,bg){g.font=`700 ${s1}px ${FONT}`;const w1=sm?g.measureText(sm).width:0;g.font=`900 ${s2}px ${FONT}`;return Math.max(w1,g.measureText(bg).width);}
  c.width=Math.ceil(measure(small,big)+pad*2+60); c.height=Math.ceil((small?s1*1.25:0)+s2*1.2+pad*1.6);
  function draw(sm,bg){
    g.clearRect(0,0,c.width,c.height);
    const w=Math.min(c.width-8,measure(sm,bg)+pad*2), x=(c.width-w)/2;
    roundRectPath(g,x,4,w,c.height-8,26); g.fillStyle='rgba(18,20,34,0.86)'; g.fill();
    g.textAlign='center'; g.textBaseline='top';
    let y=pad*0.8;
    if(sm){g.font=`700 ${s1}px ${FONT}`;g.fillStyle='#c9d0f2';g.fillText(sm,c.width/2,y);y+=s1*1.25;}
    g.font=`900 ${s2}px ${FONT}`;g.fillStyle=accent;g.fillText(bg,c.width/2,y);
  }
  draw(small,big);
  const tex=new THREE.CanvasTexture(c);tex.encoding=THREE.sRGBEncoding;tex.anisotropy=8;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false,fog:false,toneMapped:false}));
  sp.renderOrder=20; sp.scale.set(worldH*c.width/c.height,worldH,1);
  sp.userData.redraw=(a,b)=>{draw(a,b);tex.needsUpdate=true;};
  return sp;
}
const ringMat=(col)=>new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{uR:{value:1},uS:{value:3},uO:{value:1},uW:{value:0.07},uC:{value:new THREE.Color(col)}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform float uR,uS,uO,uW;uniform vec3 uC;varying vec2 vUv;void main(){vec2 p=(vUv-0.5)*uS;float d=length(p)-uR;float a=1.0-smoothstep(uW*0.35,uW,abs(d));a+=0.4*exp(-abs(d)/(uW*3.0));gl_FragColor=vec4(uC,min(a,1.0)*uO);}'});

/* ============================================================
   GROUND WORLD (town on Earth)
   ============================================================ */
const gScene=new THREE.Scene();
const daySky=canvasTex(4,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#5d9ee0');gr.addColorStop(0.55,'#a9cdee');gr.addColorStop(0.82,'#f3dcc0');gr.addColorStop(1,'#f6e6d2');g.fillStyle=gr;g.fillRect(0,0,w,h);});
const nightSky=canvasTex(4,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#03040b');gr.addColorStop(0.7,'#0a0f22');gr.addColorStop(1,'#141a33');g.fillStyle=gr;g.fillRect(0,0,w,h);});
gScene.background=daySky;
const dayFog=lin('#eedfcd'), nightFog=lin('#0b0f20');
gScene.fog=new THREE.Fog(dayFog.clone(),35,120);
const gCam=new THREE.PerspectiveCamera(55,W/H,0.1,500);
const gHemi=new THREE.HemisphereLight(lin('#d6e8ff'),lin('#8d9a6c'),0.55); gScene.add(gHemi);
const gSun=new THREE.DirectionalLight(lin('#fff0d8'),2.7);
gSun.castShadow=true; gSun.shadow.mapSize.set(2048,2048);
Object.assign(gSun.shadow.camera,{left:-34,right:34,top:34,bottom:-34,near:1,far:140});
gSun.shadow.bias=-0.0004; gSun.shadow.normalBias=0.03; gSun.shadow.radius=4;
gScene.add(gSun,gSun.target);
const groundStars=(()=>{const n=1400,p=new Float32Array(n*3);for(let i=0;i<n;i++){const a=R(0,Math.PI*2),e=Math.asin(R(0.04,1));const r=200;p.set([r*Math.cos(e)*Math.cos(a),r*Math.sin(e),r*Math.cos(e)*Math.sin(a)],i*3);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const s=new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:2.4,sizeAttenuation:false,transparent:true,opacity:0.9,fog:false}));gScene.add(s);return s;})();

const TILE=16, ROADTILE=8;
const groundTex=canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#a6d18a';g.fillRect(0,0,w,h);
  const cols=['#9ccb80','#b2d892','#a0cf86','#bcdc98','#96c57c'];
  const r2=mulberry32(5);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){g.fillStyle=cols[Math.floor(r2()*cols.length)];g.fillRect(i*128+3,j*128+3,122,122);}
  g.strokeStyle='rgba(255,255,255,0.10)';g.lineWidth=2;
  for(let i=0;i<4;i++)for(let k=0;k<6;k++){g.beginPath();g.moveTo(i*128+10,k*21+r2()*4+i%2*256);g.lineTo(i*128+118,k*21+i%2*256);g.stroke();}
},[600/TILE,600/TILE]);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshStandardMaterial({map:groundTex,roughness:0.95}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; gScene.add(ground);
const roadTex=canvasTex(256,128,(g,w,h)=>{g.fillStyle='#e6ddd0';g.fillRect(0,0,w,h);g.fillStyle='#8a8d9c';g.fillRect(0,18,w,92);g.fillStyle='#ffe08a';g.fillRect(20,61,96,6);},[600/ROADTILE,1]);
const ROADZ=-2;
const road=new THREE.Mesh(new THREE.PlaneGeometry(600,5.4),new THREE.MeshStandardMaterial({map:roadTex,roughness:0.9}));
road.rotation.x=-Math.PI/2; road.position.set(0,0.012,ROADZ); road.receiveShadow=true; gScene.add(road);
const frost=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshStandardMaterial({color:lin('#eef6ff'),roughness:1,transparent:true,opacity:0,depthWrite:false}));
frost.rotation.x=-Math.PI/2; frost.position.y=0.02; frost.receiveShadow=true; gScene.add(frost);

const WALLS=['#f6e5cb','#f7cdb9','#d3e3f6','#ead9f3','#fff1d6','#cfeedd'];
const ROOFS=['#e0736a','#6d8fd8','#8a6aa6','#e7965c','#4fb3a2'];
const CARS=['#ff6b6b','#4ecdc4','#ffd166','#5e7ce2','#f78fb3','#ffffff'];
const SHIRTS=['#ff7f6e','#5fa8ff','#ffd166','#8bd17c','#c38bff','#ff9fd1'];
const LEAVES=['#6cbf72','#86cc69','#5aae6a','#9fd46e'];
const winMats=[0,1,2,3].map(()=>new THREE.MeshStandardMaterial({color:lin('#bfe3ff'),roughness:0.25,emissive:lin('#ffcf6b'),emissiveIntensity:0}));
const lampMat=new THREE.MeshStandardMaterial({color:lin('#fff4d6'),roughness:0.4,emissive:lin('#ffd98a'),emissiveIntensity:0});
const headMat=new THREE.MeshStandardMaterial({color:lin('#fffbe8'),roughness:0.4,emissive:lin('#fff1c2'),emissiveIntensity:0});
const M={wall:WALLS.map(c=>mat(c)),roof:ROOFS.map(c=>mat(c,{roughness:0.7})),car:CARS.map(c=>mat(c,{roughness:0.45})),
  shirt:SHIRTS.map(c=>mat(c)),leaf:LEAVES.map(c=>mat(c,{roughness:0.9})),trunk:mat('#9a6a48'),dark:mat('#33364a',{roughness:0.6}),
  glass:mat('#bfe3ff',{roughness:0.25}),found:mat('#cbbfae'),skin:mat('#f2c4a2'),white:mat('#ffffff'),cloud:mat('#ffffff',{roughness:1}),pole:mat('#4a4f66',{roughness:0.6})};
const GEO={
  houseBody:rbox(2.4,1.9,2.4,0.14),
  roof:(()=>{const g=new THREE.CylinderGeometry(1.7,1.7,2.8,3,1);g.rotateX(-Math.PI/2);g.scale(1,0.55,1);return g;})(),
  door:new THREE.BoxGeometry(0.5,0.85,0.06), win:new THREE.BoxGeometry(0.5,0.45,0.06),
  chimney:rbox(0.34,0.8,0.34,0.05), found:rbox(2.9,0.18,2.9,0.06),
  trunk:new THREE.CylinderGeometry(0.13,0.18,1.3,10), canopy:new THREE.IcosahedronGeometry(0.95,2),
  carBody:rbox(1.9,0.55,0.95,0.16), carCab:rbox(1.0,0.5,0.85,0.16), wheel:new THREE.CylinderGeometry(0.2,0.2,0.16,16).rotateX(Math.PI/2),
  body:new THREE.CylinderGeometry(0.15,0.19,0.55,12), head:new THREE.SphereGeometry(0.15,16,12), cloud:new THREE.SphereGeometry(1,18,12)
};
function makeHouse(){
  const g=new THREE.Group();
  const f=new THREE.Mesh(GEO.found,M.found); f.position.y=0.09; g.add(f);
  const body=new THREE.Mesh(GEO.houseBody,pick(M.wall)); body.position.y=0.95+0.18; g.add(body);
  const roof=new THREE.Mesh(GEO.roof,pick(M.roof)); roof.position.y=1.9+0.46+0.18; g.add(roof);
  const door=new THREE.Mesh(GEO.door,M.dark); door.position.set(-0.45,0.61,1.2); g.add(door);
  const wm=pick(winMats);
  const w1=new THREE.Mesh(GEO.win,wm); w1.position.set(0.5,1.23,1.2); g.add(w1);
  const w2=new THREE.Mesh(GEO.win,wm); w2.position.set(1.2,1.23,0.4); w2.rotation.y=Math.PI/2; g.add(w2);
  const ch=new THREE.Mesh(GEO.chimney,M.wall[0]); ch.position.set(0.7,2.68,-0.4); g.add(ch);
  return shadowed(g);
}
function makeTree(s){const g=new THREE.Group();const tr=new THREE.Mesh(GEO.trunk,M.trunk);tr.position.y=0.65;g.add(tr);const c=new THREE.Mesh(GEO.canopy,pick(M.leaf));c.position.y=1.65;c.scale.set(1,1.15,1);g.add(c);g.scale.setScalar(s);return shadowed(g);}
function makeCar(m){
  const g=new THREE.Group();
  const b=new THREE.Mesh(GEO.carBody,m||pick(M.car)); b.position.y=0.48; g.add(b);
  const c=new THREE.Mesh(GEO.carCab,M.glass); c.position.set(-0.1,0.9,0); g.add(c);
  for(const [x,z] of [[-0.6,0.45],[0.6,0.45],[-0.6,-0.45],[0.6,-0.45]]){const w=new THREE.Mesh(GEO.wheel,M.dark);w.position.set(x,0.2,z);g.add(w);}
  for(const z of [-0.28,0.28]){const hl=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8),headMat);hl.position.set(0.95,0.52,z);g.add(hl);}
  return shadowed(g);
}
function makePerson(){const g=new THREE.Group();const b=new THREE.Mesh(GEO.body,pick(M.shirt));b.position.y=0.28;g.add(b);const h=new THREE.Mesh(GEO.head,M.skin);h.position.y=0.7;g.add(h);return shadowed(g);}
function makeCloud(){const g=new THREE.Group();for(let i=0;i<5;i++){const s=new THREE.Mesh(GEO.cloud,M.cloud);s.position.set(R(-2.2,2.2),R(-0.3,0.5),R(-0.8,0.8));s.scale.setScalar(R(1.0,1.8));g.add(s);}g.scale.set(1.3,0.8,1);return g;}
function makeLamp(){const g=new THREE.Group();const p=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.08,3.2,10),M.pole);p.position.y=1.6;g.add(p);
  const arm=new THREE.Mesh(rbox(0.8,0.1,0.12,0.04),M.pole);arm.position.set(-0.32,3.15,0);g.add(arm);
  const head=new THREE.Mesh(rbox(0.5,0.18,0.32,0.07),M.pole);head.position.set(-0.68,3.08,0);g.add(head);
  const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.13,14,10),lampMat);bulb.position.set(-0.68,2.96,0);g.add(bulb);return shadowed(g);}

// town layout
const houses=[];
for(let i=0;i<14;i++){const h=makeHouse();h.position.set(-50+i*7.5+R(-1,1),0,R(-9.8,-7.6));h.rotation.y=R(-0.15,0.15);gScene.add(h);houses.push(h);}
for(let i=0;i<10;i++){const h=makeHouse();h.position.set(-50+i*10+R(-1.5,1.5),0,R(-19,-15.5));h.rotation.y=R(-0.4,0.4);gScene.add(h);houses.push(h);}
for(let i=0;i<14;i++){const t=makeTree(R(0.85,1.2));t.position.set(-50+i*7.5+3.7+R(-0.6,0.6),0,R(-12,-10.5));gScene.add(t);}
for(let i=0;i<12;i++){const t=makeTree(R(1.0,1.4));t.position.set(-50+i*8.6+R(-1,1),0,R(-25,-21));gScene.add(t);}
for(const [x,z,s] of [[-7,6,1.1],[6.5,5,1.0],[9,8,1.2],[-9.5,9,1.15],[4.8,-0.2+2.2,0.8]]){const t=makeTree(s);t.position.set(x,0,z);gScene.add(t);}
for(let i=0;i<9;i++){const l=makeLamp();l.position.set(-40+i*10,0,ROADZ+3.4);gScene.add(l);}
const cars=[];for(let i=0;i<8;i++){const c=makeCar();const dir=i%2?-1:1;c.rotation.y=dir>0?0:Math.PI;gScene.add(c);cars.push({c,x0:-50+i*12.5,dir,z:ROADZ+(dir>0?0.9:-0.9)});}
const people=[];for(let i=0;i<14;i++){const p=makePerson();p.position.set(-30+i*4.5+R(-1,1),0,ROADZ+2.95+R(-0.2,0.15));p.rotation.y=R(-1,1);gScene.add(p);people.push({p,ph:R(0,6.28)});}
const clouds=[];for(let i=0;i<10;i++){const c=makeCloud();c.position.set(0,R(11,19),R(-45,-15));gScene.add(c);clouds.push({c,x0:R(-70,70)});}

// ---------- FUN LAYER (ground): birds, sunbather, reactions, phones, beanies ----------
const birds=[];
for(let i=0;i<8;i++){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.SphereGeometry(0.16,12,8),M.dark);b.scale.set(1.7,1,1);g.add(b);
  const mk=(z)=>{const p=new THREE.Group();const w=new THREE.Mesh(rbox(0.16,0.04,0.55,0.02),M.dark);w.position.z=z;p.add(w);g.add(p);return p;};
  const pl=mk(0.28), pr=mk(-0.28); shadowed(g,true,false); gScene.add(g);
  birds.push({g,pl,pr,x0:R(-30,30),y:R(7,11),z:R(-12,-3),ph:R(0,6),sp:R(2.2,3.4)});}
const sunbather=new THREE.Group(); sunbather.position.set(-3.7,0,4.0); sunbather.rotation.y=0.35; gScene.add(sunbather);
{const towel=new THREE.Mesh(rbox(1.0,0.05,2.0,0.02),mat('#ff9fd1'));towel.position.y=0.03;sunbather.add(towel);
 const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,2.3,8),M.white);pole.position.set(0.8,1.15,-0.4);sunbather.add(pole);
 const can=new THREE.Mesh(new THREE.ConeGeometry(1.25,0.55,12),mat('#4ecdc4',{roughness:0.7}));can.position.set(0.8,2.3,-0.4);sunbather.add(can);
 shadowed(sunbather);}
const lounger=makePerson(); const shades=new THREE.Mesh(rbox(0.3,0.08,0.06,0.02),M.dark); shades.position.set(0,0.72,0.13); lounger.add(shades);
const loungerPivot=new THREE.Group(); loungerPivot.position.set(0,0.12,0.7); loungerPivot.add(lounger); sunbather.add(loungerPivot);

  const L=(a,b,t)=>a+(b-a)*t;
  return L(L(L(h3(xi,yi,zi),h3(xi+1,yi,zi),xf),L(h3(xi,yi+1,zi),h3(xi+1,yi+1,zi),xf),yf),L(L(h3(xi,yi,zi+1),h3(xi+1,yi,zi+1),xf),L(h3(xi,yi+1,zi+1),h3(xi+1,yi+1,zi+1),xf),yf),zf);}

function updateFun(t,sc,E){

  if(t>=36.2&&t<44){
    const days=60*clamp((t-36.4)/7.2);
    drawTimeline({title:'SINCE LIGHTS OUT',speed:'SPED UP ≈720,000×',value:`Day ${Math.floor(days)}`,p:days/60,done:false,sub:'',ticks:[{p:0,label:'Day 0'},{p:0.5,label:'Day 30'},{p:1,label:'Day 60'}]},clamp((t-36.2)/0.4)*clamp((44-t)/0.25));
  }
  if(t>=44&&t<52){
    const a=t-44, p1=clamp((a-0.6)/2.6), p2=clamp((a-4.2)/2.8);
    const days= a<4.2 ? 7*p1 : 7+358*p2;
    const val = days<1?`Hour ${Math.floor(days*24)}`: days<30?`Day ${Math.floor(days)}`: `Month ${Math.min(12,Math.floor(days/30.4)+0)}`;
    const valFinal = p2>=1?'1 year':(p1>=1&&a<4.2?'1 week':val);
    const spd = a<4.2 ? 'SPED UP ≈230,000×' : 'SPED UP ≈11,000,000×';
    drawTimeline({title:'SINCE LIGHTS OUT',speed:spd,value:valFinal,p:a<4.2?0.3*p1:0.3+0.7*p2,done:p2>=1,sub:'',ticks:[{p:0,label:'0'},{p:0.3,label:'1 week'},{p:1,label:'1 year'}]},clamp(a/0.4)*clamp((52-t)/0.25));
  }
  // instant vs slow
  if(t>=T_OUT&&t<36){
    const a=t-T_OUT;
    drawCard('INSTANT (at 8:20)','#FFD43B',[{text:'Sunlight gone'},{text:'Sky turns black'},{text:'Earth stops curving around the Sun'}],[a/0.25-1.2,a/0.25-2.6,a/0.25-4.0],clamp((a-0.2)/0.3)*clamp((36-t)/0.25),560);
  }
  if(t>=44.4&&t<52){
    const a=t-44;
    drawCard('SLOW (weeks to years)','#8fd0ff',[{text:'Oceans & air release stored heat',icon:'~'},{text:'Temperature drops gradually',icon:'~'},{text:'Ice creeps in, not instantly',icon:'~'}],[(a-0.6)/0.3,(a-1.8)/0.3,(a-3.2)/0.3],clamp((a-0.4)/0.3)*clamp((52-t)/0.25));
  }
  // cuts
  let fade=0;
  for(const c of [7,14,22,29.6,36,44,52]) fade=Math.max(fade,1-Math.abs(t-c)/0.22);
  fade=Math.max(fade,1-t/0.45, 1-(DUR-t)/0.6);
  if(fade>0){ctx.fillStyle=`rgba(4,5,10,${clamp(fade)})`;ctx.fillRect(0,0,W,H);}
}
window.renderAt=renderAt;

/* ============================================================
   PLAYBACK / RECORDING
   ============================================================ */
let playing=true, t0=performance.now(), pausedAt=0;
const bPlay=document.getElementById('bPlay'), bRec=document.getElementById('bRec');
function now(){return playing?(performance.now()-t0)/1000:pausedAt;}
function togglePlay(){if(playing){pausedAt=now();playing=false;bPlay.textContent='Play';}else{t0=performance.now()-pausedAt*1000;playing=true;bPlay.textContent='Pause';}}
bPlay.onclick=togglePlay;
document.getElementById('bRestart').onclick=()=>{t0=performance.now();pausedAt=0;if(!playing)togglePlay();};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();togglePlay();}});
bRec.onclick=()=>{
  if(!window.MediaRecorder){alert('MediaRecorder not supported in this browser.');return;}
  const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  const mime=types.find(m=>MediaRecorder.isTypeSupported(m))||'';
  const rec=new MediaRecorder(out.captureStream(30),{mimeType:mime,videoBitsPerSecond:16e6});
  const chunks=[]; rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='sun-disappears.webm';a.click();bRec.disabled=false;bRec.textContent='Record 61s WebM';};
  t0=performance.now(); if(!playing) togglePlay();
  rec.start(); bRec.disabled=true; bRec.textContent='Recording…';
  setTimeout(()=>rec.stop(),DUR*1000+150);
};

if(fixedT!==null){ renderAt(fixedT); window.__ready=true; }
else { (function loop(){renderAt(now()%DUR);requestAnimationFrame(loop);})(); window.__ready=true; }
})();
</script>
